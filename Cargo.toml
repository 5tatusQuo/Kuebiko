[package]
name = "kuebiko"
version = "0.1.0"
edition = "2024"
description = "A local binary-exploitation learning workbench"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
libc = "0.2"
nix = { version = "0.30", features = ["fs", "ioctl", "process", "signal", "term"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pretty_assertions = "1"
